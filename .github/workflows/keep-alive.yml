name: FastFrame Stealth Keep-Alive

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Execute Stealth Ping
        env:
          TARGET_URL: ${{ secrets.RENDER_URL }}
        run: |
          echo "Initiating keep-alive ping..."
          
          if [ -z "$TARGET_URL" ]; then
            echo "ERROR: RENDER_URL secret is empty or missing."
            exit 1
          fi

          STATUS_CODE=$(curl -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/115.0.0.0 Safari/537.36" \
            -s -L -o /dev/null -w "%{http_code}" --max-time 20 "$TARGET_URL" || echo "FAILED")

          echo "Target responded with status: $STATUS_CODE"

          if [ "$STATUS_CODE" = "200" ] || [ "$STATUS_CODE" = "302" ]; then
            echo "Instance successfully warmed."
          else
            echo "Response: $STATUS_CODE (Server pinged)."
          fi
