<!DOCTYPE html>
<html lang="en" class="dark">
<!-- Same Head as login.html -->
<head>
    <!-- ... [Use identical <head> content as login.html] ... -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | FastFrame</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/ff_logo.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Plus Jakarta Sans', 'sans-serif'] }, colors: { mono: { 100: '#f4f4f5', 300: '#d4d4d8', 500: '#71717a', 700: '#27272a', 900: '#18181b', black: '#09090b', white: '#ffffff' } }, letterSpacing: { 'widest-xl': '0.3em' } } } }
    </script>
    <style>
        .film-grain { position: fixed; inset: 0; pointer-events: none; z-index: 9999; opacity: 0.05; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); }
        input:-webkit-autofill { -webkit-box-shadow: 0 0 0 30px transparent inset !important; -webkit-text-fill-color: white !important; }
        .glass-panel { background: rgba(9, 9, 11, 0.4); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .bg-slide { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 2s ease-in-out; z-index: 1; }
        .bg-slide.active { opacity: 1; }
        #focus-layer { position: absolute; inset: 0; z-index: 2; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); transition: all 0.8s ease; }
        #focus-layer.focused { backdrop-filter: blur(0px); background: rgba(0,0,0,0.3); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide-up { animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="bg-mono-black text-mono-white h-screen w-screen overflow-hidden selection:bg-mono-white selection:text-mono-black relative font-sans">
    
    <div class="film-grain"></div>
    <div id="toast-container" class="fixed top-8 left-1/2 -translate-x-1/2 z-[200] flex flex-col gap-3 pointer-events-none w-full max-w-sm px-4"></div>

    <div class="fixed inset-0 z-0 bg-mono-black">
        <img src="https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?q=80&w=1920&auto=format&fit=crop" class="bg-slide active" alt="">
        <img src="https://images.unsplash.com/photo-1511895426328-dc8714191300?q=80&w=1920&auto=format&fit=crop" class="bg-slide" alt="">
        <img src="https://images.unsplash.com/photo-1469334031218-e382a71b716b?q=80&w=1920&auto=format&fit=crop" class="bg-slide" alt="">
        <div id="focus-layer"></div>
    </div>

    <div class="relative z-10 w-full h-full flex items-center justify-center p-4 md:p-8">
        <div class="glass-panel w-full max-w-md p-8 md:p-12 rounded-3xl animate-slide-up text-center">
            <a href="/" class="inline-block mb-8">
                <img src="{{ url_for('static', filename='img/logo.png') }}" class="h-6 dark:invert hover:opacity-70 transition-opacity mx-auto">
            </a>
            <h2 class="text-3xl font-display font-bold tracking-tight mb-2">Onboard.</h2>
            <p class="text-[10px] text-mono-300 mb-8 font-sans uppercase tracking-widest">Establish a new studio environment.</p>

            <form id="register-form" class="space-y-6 text-left">
                <div class="relative group">
                    <label class="text-[9px] font-bold tracking-widest-xl uppercase text-mono-300 mb-1 block transition-colors group-focus-within:text-mono-white">Studio Name</label>
                    <input type="text" id="reg-name" required placeholder="FASTFRAME STUDIO" class="focus-trigger w-full bg-transparent font-mono text-base py-2 border-b border-mono-500 focus:border-mono-white outline-none transition-colors uppercase tracking-wider text-white">
                </div>
                <div class="relative group">
                    <label class="text-[9px] font-bold tracking-widest-xl uppercase text-mono-300 mb-1 block transition-colors group-focus-within:text-mono-white">Admin Email</label>
                    <input type="email" id="reg-email" required placeholder="ADMIN@DOMAIN.COM" class="focus-trigger w-full bg-transparent font-mono text-base py-2 border-b border-mono-500 focus:border-mono-white outline-none transition-colors uppercase tracking-wider text-white">
                </div>
                <div class="relative group">
                    <label class="text-[9px] font-bold tracking-widest-xl uppercase text-mono-300 mb-1 block transition-colors group-focus-within:text-mono-white">Passkey</label>
                    <input type="password" id="reg-password" required minlength="8" placeholder="••••••••" class="focus-trigger w-full bg-transparent font-mono text-base py-2 border-b border-mono-500 focus:border-mono-white outline-none transition-colors tracking-widest text-white">
                </div>
                <button type="submit" id="reg-submit-btn" class="w-full bg-mono-white text-mono-black py-4 rounded-full text-[10px] font-bold tracking-widest uppercase hover:scale-[0.98] transition-transform flex justify-center items-center gap-3 mt-8">
                    <span>Continue to Verification</span> &rarr;
                </button>
            </form>
            <div class="mt-8 pt-6 border-t border-white/10">
                <a href="/auth/login" class="text-[9px] font-bold tracking-widest uppercase text-mono-300 hover:text-mono-white transition-colors">Already registered? Log in</a>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
